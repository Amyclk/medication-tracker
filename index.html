<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MediDay</title>

    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
</head>

<body>

    <h1>💊 MediDay</h1>

    <!-- Choix du mode d'affichage -->
    <div id="view-selector">

        <button id="yearView">Année</button>

        <button id="monthView">Mois</button>

        <button id="weekView">Semaine</button>

        <button id="dayView">Jour</button>

    </div>
    

    <div id="navigation">

    <button id="previousButton">←</button>

    <span id="currentPeriod"></span>

    <button id="nextButton">→</button>

    </div>

    <!-- Calendrier -->
    <div id="calendar"></div>


    <!-- Fenêtre qui apparaît lorsqu'on clique sur un jour -->
    <div id="dayModal" class="modal">

        <div class="modal-content">

            <button id="closeModal">✕</button>

            <h2 id="selectedDate"></h2>

            <div class="medication-checks">

                <label>
                    <input type="checkbox" id="dose1">
                    💊 Prise 1
                </label>

                <label>
                    <input type="checkbox" id="dose2">
                    💊 Prise 2
                </label>

            </div>

        </div>

    </div>


    <script src="script.js"></script>

</body>

</html>
